<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Простой конвертер px в rem и rem в px.">
    <title>Rem Конвертер</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="main">
    <div class="container">
        <h1 class="title">Rem Конвертер</h1>

        <div class="converter-body">
            <div class="input-container">
                <label class="input-label" for="input-base">
                    Величина шрифта HTML документа
                    <input
                        class="input-base"
                        id="input-base"
                        type="text"
                        inputmode="decimal"
                        name="input-base"
                        value="16"
                        autocomplete="off"
                        aria-describedby="input-error"
                    >
                </label>
            </div>

            <p class="input-error" id="input-error" role="alert">
                Введите величину шрифта больше 0
            </p>

            <div class="input-container">
                <label class="input-label" for="input-px">
                    px
                    <input
                        class="input-px"
                        id="input-px"
                        type="text"
                        inputmode="decimal"
                        name="input-px"
                        value="16"
                        autocomplete="off"
                    >
                </label>
            </div>

            <div class="input-container">
                <label class="input-label" for="input-rem">
                    rem
                    <input
                        class="input-rem"
                        id="input-rem"
                        type="text"
                        inputmode="decimal"
                        name="input-rem"
                        value="1"
                        autocomplete="off"
                    >
                </label>
            </div>

            <div class="button-container">
                <button class="button-clear" type="button">Очистить</button>
            </div>

            <div class="converter-author">
                Developed by&nbsp;
                <a
                    class="converter-author__link"
                    href="https://t.me/RostITFreelance"
                    target="_blank"
                    rel="noopener noreferrer"
                >Rostislav Yakubovsky</a>
            </div>
        </div>
    </div>
</main>

<script src="scripts/script.js"></script>
</body>
</html>
