<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Простой конвертер px в rem и rem в px.">
    <title>Rem Конвертер</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="main">
    <div class="page-layout">
        <div class="container">
            <h1 class="title">Rem Конвертер</h1>

        <div class="converter-body">
            <div class="input-container">
                <label class="input-label" for="input-base">
                    Величина шрифта HTML документа
                </label>
                <div class="input-wrapper">
                    <input
                        class="input-base"
                        id="input-base"
                        type="text"
                        inputmode="decimal"
                        name="input-base"
                        value="16px"
                        autocomplete="off"
                        aria-describedby="input-error"
                    >
                </div>
            </div>

            <p class="input-error" id="input-error" role="alert">
                Введите величину шрифта больше 0
            </p>

            <div class="input-container">
                <label class="input-label" for="input-px">
                    px
                </label>
                <div class="input-wrapper">
                    <input
                        class="input-px"
                        id="input-px"
                        type="text"
                        inputmode="decimal"
                        name="input-px"
                        value="16px"
                        autocomplete="off"
                    >
                    <button class="button-copy" type="button" aria-label="Копировать значение" title="Копировать значение" data-copy-target="input-px">
                        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                            <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                            <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="input-container">
                <label class="input-label" for="input-rem">
                    rem
                </label>
                <div class="input-wrapper">
                    <input
                        class="input-rem"
                        id="input-rem"
                        type="text"
                        inputmode="decimal"
                        name="input-rem"
                        value="1rem"
                        autocomplete="off"
                    >
                    <button class="button-copy" type="button" aria-label="Копировать значение" title="Копировать значение" data-copy-target="input-rem">
                        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                            <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                            <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="button-container">
                <button class="button-clear" type="button">Очистить</button>
            </div>

            <div class="converter-author">
                Developed by&nbsp;
                <a
                    class="converter-author__link"
                    href="https://t.me/RostITFreelance"
                    target="_blank"
                    rel="noopener noreferrer"
                >Rostislav Yakubovsky</a>
            </div>
        </div>

        <aside class="conversion-history" aria-labelledby="history-title">
            <div class="conversion-history__header">
                <h2 class="conversion-history__title" id="history-title">Используемые значения</h2>
            </div>
            <div class="conversion-history__list"></div>
            <button class="button-history-clear" type="button">Очистить</button>
        </aside>
    </div>
</main>

<script src="scripts/script.js"></script>
</body>
</html>
